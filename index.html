<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Pulse</title>

  <!-- html2pdf.js for Client-Side PDF Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Clean Sans + Elegant Serif Accent Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #F2F0EC;
      --card-bg: #FFFFFF;
      --text: #1C1C1A;
      --text-muted: #666460;
      --walnut: #5C4033;
      --walnut-light: #7A5745;
      --border: #E2DFD8;
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.08);
      --shadow-hover: 0 20px 40px -15px rgba(0, 0, 0, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      padding: 2rem 1rem;
    }

    /* Ambient Interactive 3D Background Circles */
    .bg-circle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, var(--walnut) 0%, rgba(92, 64, 51, 0) 70%);
      opacity: 0.12;
      pointer-events: none;
      transition: transform 0.2s cubic-bezier(0.1, 0.7, 0.1, 1);
      z-index: 0;
    }

    .circle-1 {
      width: 500px;
      height: 500px;
      top: -100px;
      left: -150px;
    }

    .circle-2 {
      width: 600px;
      height: 600px;
      bottom: -150px;
      right: -150px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 1rem;
    }

    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 3.5rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    /* Search Console Card */
    .search-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: var(--shadow);
    }

    .input-group {
      display: flex;
      gap: 0.75rem;
    }

    input[type="url"] {
      flex: 1;
      padding: 0.85rem 1.2rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      font-family: inherit;
      background: #FAFAFAF8;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    input[type="url"]:focus {
      border-color: var(--walnut);
      background: #FFFFFF;
    }

    button.btn-primary {
      background: var(--walnut);
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      padding: 0.85rem 1.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button.btn-primary:hover {
      background: var(--walnut-light);
    }

    button.btn-primary:active {
      transform: scale(0.98);
    }

    /* 3D Perspective Card Grid */
    .grid-container {
      perspective: 1000px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .tilt-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
      transform-style: preserve-3d;
      will-change: transform;
      transition: transform 0.1s ease-out, box-shadow 0.2s ease;
    }

    .tilt-card:hover {
      box-shadow: var(--shadow-hover);
    }

    .tilt-card h3 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      transform: translateZ(20px);
    }

    .tilt-card .metric-value {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text);
      transform: translateZ(35px);
    }

    /* Results Section */
    #report-section {
      display: none;
      flex-direction: column;
      gap: 1.5rem;
    }

    .actions-bar {
      display: flex;
      justify-content: flex-end;
    }

    button.btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 0.6rem 1.2rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.btn-secondary:hover {
      background: #EAE6DF;
    }

    /* Footer */
    footer {
      margin-top: auto;
      padding-top: 3rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      z-index: 1;
    }

    footer a {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Background Animated Circles -->
  <div class="bg-circle circle-1" id="c1"></div>
  <div class="bg-circle circle-2" id="c2"></div>

  <div class="container">
    <header>
      <h1>Page Pulse</h1>
      <p class="subtitle">Real-time web performance & metadata audit</p>
    </header>

    <!-- URL Input Console -->
    <div class="search-card">
      <form id="analyze-form" class="input-group">
        <input type="url" id="url-input" placeholder="https://example.com" required>
        <button type="submit" class="btn-primary" id="submit-btn">Analyze</button>
      </form>
    </div>

    <!-- Generated Audit Report Container -->
    <div id="report-section">
      <div class="actions-bar">
        <button class="btn-secondary" id="download-pdf">Download PDF Report</button>
      </div>

      <div class="grid-container" id="pdf-content">
        <div class="tilt-card">
          <h3>Load Time</h3>
          <div class="metric-value" id="val-speed">--</div>
        </div>
        <div class="tilt-card">
          <h3>Headings (H1-H3)</h3>
          <div class="metric-value" id="val-headings">--</div>
        </div>
        <div class="tilt-card">
          <h3>HTTP Status</h3>
          <div class="metric-value" id="val-status">--</div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    Crafted with care by <a href="https://digitalheroesco.com" target="_blank">Digital Heroes Co</a>
  </footer>

  <script>
    // Relative URL works out-of-the-box on unified Vercel deployment
    const API_BASE_URL = '';

    // Interactive Mouse-Tracking Background Circles
    document.addEventListener('mousemove', (e) => {
      const { clientX, clientY } = e;
      const xOffset = (clientX / window.innerWidth - 0.5) * 40;
      const yOffset = (clientY / window.innerHeight - 0.5) * 40;

      const c1 = document.getElementById('c1');
      const c2 = document.getElementById('c2');

      if (c1) c1.style.transform = `translate(${xOffset}px, ${yOffset}px)`;
      if (c2) c2.style.transform = `translate(${-xOffset}px, ${-yOffset}px)`;
    });

    // 3D Card Tilt Effect Functionality
    function init3DTilt() {
      const cards = document.querySelectorAll('.tilt-card');
      
      cards.forEach(card => {
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          
          const rotateX = ((y - centerY) / centerY) * -12;
          const rotateY = ((x - centerX) / centerX) * 12;
          
          card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        card.addEventListener('mouseleave', () => {
          card.style.transform = 'rotateX(0deg) rotateY(0deg)';
          card.style.transition = 'transform 0.5s ease';
        });

        card.addEventListener('mouseenter', () => {
          card.style.transition = 'none';
        });
      });
    }

    // Initialize 3D on load
    document.addEventListener('DOMContentLoaded', init3DTilt);

    // Form Handling & API Fetch
    const form = document.getElementById('analyze-form');
    const submitBtn = document.getElementById('submit-btn');
    const reportSection = document.getElementById('report-section');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const targetUrl = document.getElementById('url-input').value;
      
      submitBtn.textContent = 'Analyzing...';
      submitBtn.disabled = true;

      try {
        const response = await fetch(`${API_BASE_URL}/api/analyze`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: targetUrl })
        });

        if (!response.ok) throw new Error('Analysis request failed');

        const data = await response.json();

        // Update metrics
        document.getElementById('val-speed').textContent = data.load_time ? `${data.load_time}s` : 'N/A';
        document.getElementById('val-headings').textContent = data.heading_count ?? 'N/A';
        document.getElementById('val-status').textContent = data.status_code ?? '200 OK';

        reportSection.style.display = 'flex';
      } catch (err) {
        alert('Could not complete analysis. Please verify the URL and backend status.');
      } finally {
        submitBtn.textContent = 'Analyze';
        submitBtn.disabled = false;
      }
    });

    // PDF Export Functionality
    document.getElementById('download-pdf').addEventListener('click', () => {
      const element = document.getElementById('pdf-content');
      const opt = {
        margin:       0.5,
        filename:     'PagePulse_Report.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save();
    });
  </script>
</body>
</html>
